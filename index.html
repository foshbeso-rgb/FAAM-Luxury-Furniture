<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Future Home - أثاث فاخر بتصميمات راقية لغرف المعيشة والنوم">
    <meta name="theme-color" content="#01111e">
    <title>Future Home | Luxury Furniture</title>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --dark-gold: #b8860b;
            --navy: #01111e;
            --card: rgba(5, 28, 47, 0.92);
            --white: #ffffff;
            --muted: #aaaaaa;
            --success: #25d366;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at center, #02243d 0%, #01111e 100%);
            color: var(--white);
            font-family: "Cairo", sans-serif;
            overflow-x: hidden;
        }

        body.lightbox-open {
            overflow: hidden;
        }

        #particles-js {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        button,
        a {
            font-family: inherit;
        }

        .hidden {
            display: none !important;
        }

        /* شاشة الدخول */
        #overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, #01111e 0%, #000000 100%);
            cursor: pointer;
        }

        #overlay h1 {
            margin: 0 0 14px;
            color: var(--gold);
            font-family: "Playfair Display", serif;
            font-size: clamp(2.6rem, 8vw, 4rem);
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
        }

        #overlay p {
            margin: 0;
            padding: 10px 30px;
            border: 1px solid var(--gold);
            border-radius: 30px;
            color: var(--muted);
            font-size: 1.1rem;
            transition: 0.3s;
        }

        #overlay p:hover {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 15px var(--gold);
        }

        .content {
            position: relative;
            z-index: 1;
            padding: 20px 0 80px;
            text-align: center;
        }

        .logo {
            margin: 10px 0 0;
            color: var(--gold);
            font-family: "Playfair Display", serif;
            font-size: clamp(3rem, 8vw, 4.5rem);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .slogan {
            margin: 0 0 25px;
            color: var(--gold);
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 5px;
        }

        /* الأدوات العلوية */
        .top-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding: 0 15px;
        }

        .lang-switch,
        .music-toggle {
            padding: 9px 20px;
            border: 1px solid var(--gold);
            border-radius: 30px;
            background: transparent;
            color: var(--gold);
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .lang-switch:hover,
        .music-toggle:hover,
        .music-toggle.is-playing {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 15px var(--gold);
        }

        /* شريط التصنيفات */
        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            max-width: 900px;
            margin: 0 auto 30px;
            padding: 14px;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50px;
            background: rgba(1, 17, 30, 0.7);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
        }

        nav button {
            padding: 8px 20px;
            border: 0;
            border-radius: 25px;
            background: transparent;
            color: #e0e0e0;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        nav button:hover,
        nav button.active {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 10px var(--gold);
        }

        /* شبكة المنتجات */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1350px;
            margin: auto;
            padding: 0 30px 40px;
        }

        .card {
            position: relative;
            overflow: hidden;
            padding: 20px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 20px;
            background: linear-gradient(145deg, var(--card) 0%, rgba(1, 15, 27, 0.96) 100%);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
        }

        .product-img {
            width: 100%;
            height: 230px;
            display: block;
            margin-bottom: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 15px;
            background: #010f1b;
            object-fit: cover;
            cursor: zoom-in;
            transition: transform 0.3s;
        }

        .product-img:hover {
            transform: scale(1.03);
        }

        .card h3 {
            min-height: 58px;
            margin: 10px 0;
            color: var(--white);
            font-size: 1.35rem;
            font-weight: 600;
        }

        .price {
            margin: 5px 0 2px;
            color: var(--gold);
            font-family: "Playfair Display", serif;
            font-size: 1.55rem;
            font-weight: 700;
        }

        .price-usd {
            margin: 0 0 10px;
            color: #e5d28a;
            font-size: 0.95rem;
        }

        .status {
            min-height: 28px;
            margin-bottom: 15px;
            color: #ffaa00;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .btn {
            display: block;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--dark-gold) 0%, var(--gold) 50%, var(--dark-gold) 100%);
            color: #000;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.02);
            background: linear-gradient(90deg, var(--gold) 0%, #fff 50%, var(--gold) 100%);
            box-shadow: 0 0 20px var(--gold);
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 40px 20px;
            color: var(--muted);
        }

        /* Lightbox */
        #lightbox {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 30px;
            background: rgba(0, 0, 0, 0.92);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #lightbox.active {
            display: flex;
            opacity: 1;
        }

        #lightbox img {
            max-width: min(100%, 1000px);
            max-height: 85vh;
            border: 2px solid var(--gold);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
        }

        #lightbox .close {
            position: absolute;
            top: 20px;
            right: 30px;
            border: 0;
            background: transparent;
            color: #fff;
            font-size: 42px;
            cursor: pointer;
            transition: 0.3s;
        }

        #lightbox .close:hover {
            color: var(--gold);
        }

        /* أزرار الاتصال */
        .float-actions {
            position: fixed;
            bottom: 25px;
            left: 25px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .float-btn {
            width: 58px;
            height: 58px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            color: #fff;
            font-size: 25px;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            transition: 0.3s;
        }

        .float-btn:hover {
            transform: scale(1.1);
        }

        .wa {
            background: var(--success);
        }

        .phone {
            background: var(--gold);
            color: #000;
        }

        @media (max-width: 600px) {
            .content {
                padding-top: 12px;
            }

            .slogan {
                font-size: 0.72rem;
                letter-spacing: 3px;
            }

            nav {
                margin-right: 15px;
                margin-left: 15px;
                border-radius: 20px;
            }

            nav button {
                padding: 7px 12px;
                font-size: 0.85rem;
            }

            .grid {
                grid-template-columns: 1fr;
                padding-right: 18px;
                padding-left: 18px;
            }

            .product-img {
                height: 210px;
            }

            .float-actions {
                bottom: 15px;
                left: 15px;
            }

            .float-btn {
                width: 52px;
                height: 52px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div id="overlay" role="button" tabindex="0" aria-label="بدء تجربة الموقع">
        <h1>Future Home</h1>
        <p id="overlayText">اضغط للدخول إلى عالم الفخامة</p>
    </div>

    <audio id="bgMusic" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" loop></audio>

    <div id="particles-js" aria-hidden="true"></div>

    <div id="lightbox" role="dialog" aria-modal="true" aria-label="عرض صورة المنتج">
        <button class="close" id="closeLightbox" aria-label="إغلاق الصورة">&times;</button>
        <img id="lightboxImg" src="" alt="">
    </div>

    <div class="float-actions">
        <a id="phoneLink" href="tel:201000000000" class="float-btn phone" aria-label="الاتصال بنا">
            <i class="fas fa-phone" aria-hidden="true"></i>
        </a>

        <a id="whatsappLink" href="https://wa.me/201000000000" class="float-btn wa" target="_blank" rel="noopener" aria-label="التواصل عبر واتساب">
            <i class="fab fa-whatsapp" aria-hidden="true"></i>
        </a>
    </div>

    <main class="content">
        <div class="top-actions">
            <button class="lang-switch" id="languageButton" type="button">
                English
            </button>

            <button class="music-toggle" id="musicButton" type="button">
                <i class="fas fa-volume-up" aria-hidden="true"></i>
                <span id="musicButtonText">تشغيل الموسيقى</span>
            </button>
        </div>

        <h1 class="logo">Future Home</h1>
        <p class="slogan" id="slogan">الفخامة والتميز في كل قطعة</p>

        <nav id="navBar" aria-label="تصنيفات المنتجات">
            <button type="button" class="active" data-category="all">الكل</button>
            <button type="button" data-category="living">غرف المعيشة</button>
            <button type="button" data-category="bedroom">غرف النوم</button>
            <button type="button" data-category="dining">غرف الطعام</button>
        </nav>

        <section class="grid" id="productGrid" aria-live="polite"></section>
    </main>

    <script>
        const STORE_PHONE = "201000000000";
        const USD_RATE = 49;

        let currentLanguage = "ar";
        let currentCategory = "all";
        let musicStarted = false;

        const products = [
            {
                category: "living",
                nameAr: "كرسي كلاسيك ذهبي فاخر",
                nameEn: "Luxury Golden Classic Chair",
                priceEgp: 2000,
                statusAr: "متاح قطعة واحدة فقط",
                statusEn: "Only 1 item left",
                image: "https://images.unsplash.com/photo-1586023492125-27b2c045efd7?q=80&w=900&auto=format&fit=crop"
            },
            {
                category: "bedroom",
                nameAr: "سرير ملكي مخملي راقي",
                nameEn: "Royal Velvet Luxury Bed",
                priceEgp: 15000,
                statusAr: "متاح بالطلب المسبق",
                statusEn: "Available on Pre-order",
                image: "https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=900&auto=format&fit=crop"
            },
            {
                category: "living",
                nameAr: "أريكة فاخرة بتصميم عصري",
                nameEn: "Modern Luxury Sofa",
                priceEgp: 18500,
                statusAr: "متاح حاليًا",
                statusEn: "Available now",
                image: "https://images.unsplash.com/photo-1555041469-a586c61ea9bc?q=80&w=900&auto=format&fit=crop"
            },
            {
                category: "dining",
                nameAr: "طاولة طعام خشبية أنيقة",
                nameEn: "Elegant Wooden Dining Table",
                priceEgp: 12500,
                statusAr: "متاح حسب الطلب",
                statusEn: "Made to order",
                image: "https://images.unsplash.com/photo-1617806118233-18e1de247200?q=80&w=900&auto=format&fit=crop"
            },
            {
                category: "bedroom",
                nameAr: "كومودينو بتفاصيل ذهبية",
                nameEn: "Golden Detail Nightstand",
                priceEgp: 4200,
                statusAr: "متاح حاليًا",
                statusEn: "Available now",
                image: "https://images.unsplash.com/photo-1618220179428-22790b461013?q=80&w=900&auto=format&fit=crop"
            },
            {
                category: "living",
                nameAr: "طاولة جانبية فاخرة",
                nameEn: "Luxury Side Table",
                priceEgp: 3500,
                statusAr: "متاح حاليًا",
                statusEn: "Available now",
                image: "https://images.unsplash.com/photo-1532372320572-cda25653a26d?q=80&w=900&auto=format&fit=crop"
            }
        ];

        const translations = {
            ar: {
                direction: "rtl",
                languageButton: "English",
                slogan: "الفخامة والتميز في كل قطعة",
                overlayText: "اضغط للدخول إلى عالم الفخامة",
                musicOn: "إيقاف الموسيقى",
                musicOff: "تشغيل الموسيقى",
                order: "اطلب المنتج الآن",
                empty: "لا توجد منتجات في هذا التصنيف حاليًا",
                categories: {
                    all: "الكل",
                    living: "غرف المعيشة",
                    bedroom: "غرف النوم",
                    dining: "غرف الطعام"
                }
            },
            en: {
                direction: "ltr",
                languageButton: "العربية",
                slogan: "ELEGANCE IN EVERY PIECE",
                overlayText: "Click to Enter the World of Luxury",
                musicOn: "Pause Music",
                musicOff: "Play Music",
                order: "Order Now",
                empty: "No products in this category yet",
                categories: {
                    all: "All",
                    living: "Living Rooms",
                    bedroom: "Bedrooms",
                    dining: "Dining Rooms"
                }
            }
        };

        const moneyFormatter = new Intl.NumberFormat("en-US");

        function formatEgp(value) {
            return `${moneyFormatter.format(value)} ${currentLanguage === "ar" ? "ج.م" : "EGP"}`;
        }

        function formatUsd(value) {
            const usdValue = value / USD_RATE;
            return `≈ $${usdValue.toFixed(2)} USD`;
        }

        function getProductName(product) {
            return currentLanguage === "ar" ? product.nameAr : product.nameEn;
        }

        function getProductStatus(product) {
            return currentLanguage === "ar" ? product.statusAr : product.statusEn;
        }

        function renderProducts() {
            const grid = document.getElementById("productGrid");
            grid.innerHTML = "";

            const filteredProducts = products.filter(product =>
                currentCategory === "all" || product.category === currentCategory
            );

            if (filteredProducts.length === 0) {
                const empty = document.createElement("div");
                empty.className = "empty-state";
                empty.textContent = translations[currentLanguage].empty;
                grid.appendChild(empty);
                return;
            }

            filteredProducts.forEach(product => {
                const card = document.createElement("article");
                card.className = "card";

                const image = document.createElement("img");
                image.className = "product-img";
                image.src = product.image;
                image.alt = getProductName(product);
                image.loading = "lazy";
                image.addEventListener("click", () => openLightbox(product.image, image.alt));

                const title = document.createElement("h3");
                title.textContent = getProductName(product);

                const price = document.createElement("p");
                price.className = "price";
                price.textContent = formatEgp(product.priceEgp);

                const usdPrice = document.createElement("p");
                usdPrice.className = "price-usd";
                usdPrice.textContent = formatUsd(product.priceEgp);

                const status = document.createElement("div");
                status.className = "status";
                status.textContent = getProductStatus(product);

                const orderButton = document.createElement("a");
                orderButton.className = "btn";
                orderButton.target = "_blank";
                orderButton.rel = "noopener";

                const message = currentLanguage === "ar"
                    ? `أود طلب منتج: ${product.nameAr}`
                    : `I would like to order: ${product.nameEn}`;

                orderButton.href = `https://wa.me/${STORE_PHONE}?text=${encodeURIComponent(message)}`;
                orderButton.textContent = translations[currentLanguage].order;

                card.append(image, title, price, usdPrice, status, orderButton);
                grid.appendChild(card);
            });
        }

        function updateStaticText() {
            const language = translations[currentLanguage];

            document.documentElement.lang = currentLanguage;
            document.body.dir = language.direction;

            document.getElementById("languageButton").textContent = language.languageButton;
            document.getElementById("slogan").textContent = language.slogan;
            document.getElementById("overlayText").textContent = language.overlayText;

            document.querySelectorAll("[data-category]").forEach(button => {
                button.textContent = language.categories[button.dataset.category];
                button.classList.toggle("active", button.dataset.category === currentCategory);
            });

            document.getElementById("musicButtonText").textContent =
                musicStarted ? language.musicOn : language.musicOff;

            renderProducts();
        }

        function toggleLanguage() {
            currentLanguage = currentLanguage === "ar" ? "en" : "ar";
            updateStaticText();
        }

        function selectCategory(category) {
            currentCategory = category;
            updateStaticText();
        }

        function openLightbox(src, alt) {
            const lightbox = document.getElementById("lightbox");
            const image = document.getElementById("lightboxImg");

            image.src = src;
            image.alt = alt;
            lightbox.classList.add("active");
            document.body.classList.add("lightbox-open");
        }

        function closeLightbox() {
            document.getElementById("lightbox").classList.remove("active");
            document.body.classList.remove("lightbox-open");
        }

        async function toggleMusic() {
            const music = document.getElementById("bgMusic");
            const button = document.getElementById("musicButton");

            if (music.paused) {
                try {
                    await music.play();
                    musicStarted = true;
                    button.classList.add("is-playing");
                } catch (error) {
                    console.log("Music playback was blocked.");
                }
            } else {
                music.pause();
                musicStarted = false;
                button.classList.remove("is-playing");
            }

            updateStaticText();
        }

        function startExperience() {
            const overlay = document.getElementById("overlay");
            overlay.classList.add("hidden");

            const music = document.getElementById("bgMusic");
            music.volume = 0.15;

            toggleMusic();

            if (typeof particlesJS === "function") {
                particlesJS("particles-js", {
                    particles: {
                        number: {
                            value: 75,
                            density: {
                                enable: true,
                                value_area: 800
                            }
                        },
                        color: {
                            value: ["#d4af37", "#ffffff"]
                        },
                        shape: {
                            type: "circle"
                        },
                        opacity: {
                            value: 0.5,
                            random: true
                        },
                        size: {
                            value: 2.5,
                            random: true
                        },
                        line_linked: {
                            enable: true,
                            distance: 130,
                            color: "#d4af37",
                            opacity: 0.15,
                            width: 1
                        },
                        move: {
                            enable: true,
                            speed: 0.6,
                            direction: "none",
                            random: true,
                            straight: false,
                            out_mode: "out"
                        }
                    },
                    interactivity: {
                        events: {
                            onhover: {
                                enable: true,
                                mode: "bubble"
                            }
                        },
                        modes: {
                            bubble: {
                                distance: 100,
                                size: 4,
                                duration: 2,
                                opacity: 0.8
                            }
                        }
                    }
                });
            }
        }

        document.getElementById("overlay").addEventListener("click", startExperience);
        document.getElementById("overlay").addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
                startExperience();
            }
        });

        document.getElementById("languageButton").addEventListener("click", toggleLanguage);
        document.getElementById("musicButton").addEventListener("click", toggleMusic);

        document.querySelectorAll("[data-category]").forEach(button => {
            button.addEventListener("click", () => {
                selectCategory(button.dataset.category);
            });
        });

        document.getElementById("closeLightbox").addEventListener("click", closeLightbox);

        document.getElementById("lightbox").addEventListener("click", event => {
            if (event.target.id === "lightbox") {
                closeLightbox();
            }
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                closeLightbox();
            }
        });

        document.getElementById("phoneLink").href = `tel:${STORE_PHONE}`;
        document.getElementById("whatsappLink").href = `https://wa.me/${STORE_PHONE}`;

        updateStaticText();
    </script>
</body>
</html>
